services:
  emqx:
    image: emqx/emqx:6.3.1
    container_name: emqx
    restart: always
    ports:
      - "8883:8883"     # Único puerto expuesto: MQTT sobre TLS (Let's Encrypt mqtt.agrotecnet.cloud)
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASS}
      # TLS 1.2/1.3 con el certificado sincronizado por /usr/local/bin/emqx-cert-sync.sh
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE=/opt/emqx/etc/a3/certs/fullchain.pem
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE=/opt/emqx/etc/a3/certs/privkey.pem
      - EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERSIONS=["tlsv1.3","tlsv1.2"]
      # Autenticación usuario/clave (base interna, cargada desde CSV con hashes sha256+sal)
      - EMQX_AUTHENTICATION__1__MECHANISM=password_based
      - EMQX_AUTHENTICATION__1__BACKEND=built_in_database
      - EMQX_AUTHENTICATION__1__USER_ID_TYPE=username
      - EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME=sha256
      - EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION=suffix
      - EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE=/opt/emqx/etc/a3/usuarios.csv
      - EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE=hash
      # Autorización: ACL propia, todo lo demás negado
      - EMQX_AUTHORIZATION__NO_MATCH=deny
      - EMQX_AUTHORIZATION__SOURCES__1__TYPE=file
      - EMQX_AUTHORIZATION__SOURCES__1__PATH=/opt/emqx/etc/a3/acl.conf
    volumes:
      - /opt/a3/emqx:/opt/emqx/etc/a3:ro
    networks:
      - iot_network

networks:
  iot_network:
    external: true


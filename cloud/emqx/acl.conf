%% A3 - secado de café. Todo lo no listado se niega (authorization.no_match = deny).
{allow, {username, "gateway-rpi"},   publish,   ["cafe/+/telemetria", "cafe/+/estado", "cafe/+/agregado"]}.
{allow, {username, "gateway-rpi"},   subscribe, ["cafe/+/cmd"]}.
{allow, {username, "svc-nodered"},   subscribe, ["cafe/#"]}.
{allow, {username, "svc-nodered"},   publish,   ["cafe/alertas", "cafe/+/cmd"]}.
{allow, {username, "svc-anomalias"}, subscribe, ["cafe/+/telemetria"]}.
{allow, {username, "svc-anomalias"}, publish,   ["cafe/+/anomalia"]}.
{allow, {username, "prueba-pc"},     all,       ["prueba/#"]}.
{deny, all}.

<svg xmlns="http://www.w3.org/2000/svg" width="1360" viewBox="0 0 680 702" role="img">
<title>Arquitectura cloud-fog-edge A3 secado de café</title>
<style>
text{font-family:Segoe UI,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-gray>rect{fill:#FFFFFF;stroke:#888780}.c-gray>.th{fill:#2C2C2A}.c-gray>.ts{fill:#5F5E5A}
</style>
<rect width="680" height="702" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="40" y="20" width="600" height="120" rx="16" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Edge · ESP32-C3 SuperMini (un montaje, 3 IDs)</text>
<text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">DHT22 (T, HR) · LDR (luz) · MQ-7 (CO) · RTC DS3231 · banda muerta</text></g>
<g class="c-gray"><rect x="65" y="78" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="150" y="100" text-anchor="middle" dominant-baseline="central">marquesina-01</text></g>
<g class="c-gray"><rect x="255" y="78" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="100" text-anchor="middle" dominant-baseline="central">marquesina-02</text></g>
<g class="c-gray"><rect x="445" y="78" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="530" y="100" text-anchor="middle" dominant-baseline="central">marquesina-03</text></g>
<line x1="340" y1="142" x2="340" y2="178" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="160" dominant-baseline="central">WiFi propia de la RPi · MQTT/TLS 8883 · CA de la finca</text>
<g class="c-purple"><rect x="40" y="182" width="600" height="120" rx="16" stroke-width="0.5"/>
<text class="th" x="340" y="204" text-anchor="middle" dominant-baseline="central">Fog · Raspberry Pi 3 B+ (raspberry-robin.local)</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">AP WiFi 192.168.50.1 (nodos sin Internet) · eth0 al router</text></g>
<g class="c-gray"><rect x="65" y="240" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="150" y="256" text-anchor="middle" dominant-baseline="central">NanoMQ</text><text class="ts" x="150" y="274" text-anchor="middle" dominant-baseline="central">TLS · ACL · bridge con caché</text></g>
<g class="c-gray"><rect x="255" y="240" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="340" y="256" text-anchor="middle" dominant-baseline="central">Node-RED</text><text class="ts" x="340" y="274" text-anchor="middle" dominant-baseline="central">flujos locales · login</text></g>
<g class="c-gray"><rect x="445" y="240" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="530" y="256" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="530" y="274" text-anchor="middle" dominant-baseline="central">respaldo local</text></g>
<line x1="340" y1="304" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="322" dominant-baseline="central">Bridge MQTT/TLS 8883 · store-and-forward · Internet</text>
<g class="c-coral"><rect x="40" y="344" width="600" height="250" rx="16" stroke-width="0.5"/>
<text class="th" x="340" y="366" text-anchor="middle" dominant-baseline="central">Cloud · VPS Hostinger · agrotecnet.cloud</text>
<text class="ts" x="340" y="384" text-anchor="middle" dominant-baseline="central">179.236.81.29 · Docker · expuestos solo 22, 80, 443, 8883</text></g>
<g class="c-gray"><rect x="65" y="402" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="150" y="418" text-anchor="middle" dominant-baseline="central">EMQX</text><text class="ts" x="150" y="436" text-anchor="middle" dominant-baseline="central">TLS · auth · ACL</text></g>
<g class="c-gray"><rect x="255" y="402" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="340" y="418" text-anchor="middle" dominant-baseline="central">Node-RED</text><text class="ts" x="340" y="436" text-anchor="middle" dominant-baseline="central">ingesta · reglas</text></g>
<g class="c-gray"><rect x="445" y="402" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="530" y="418" text-anchor="middle" dominant-baseline="central">Anomalías (Python)</text><text class="ts" x="530" y="436" text-anchor="middle" dominant-baseline="central">puntaje z en ventana</text></g>
<g class="c-gray"><rect x="65" y="470" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="150" y="486" text-anchor="middle" dominant-baseline="central">TimescaleDB</text><text class="ts" x="150" y="504" text-anchor="middle" dominant-baseline="central">series de tiempo</text></g>
<g class="c-gray"><rect x="255" y="470" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="340" y="486" text-anchor="middle" dominant-baseline="central">Panel web FastAPI</text><text class="ts" x="340" y="504" text-anchor="middle" dominant-baseline="central">3 perfiles · login</text></g>
<g class="c-gray"><rect x="445" y="470" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="530" y="486" text-anchor="middle" dominant-baseline="central">Nginx Proxy Manager</text><text class="ts" x="530" y="504" text-anchor="middle" dominant-baseline="central">HTTPS Let's Encrypt</text></g>
<g class="c-gray"><rect x="65" y="534" width="550" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="556" text-anchor="middle" dominant-baseline="central">Monitoreo · latencia p50/p95 · SLI/SLO · métricas EMQX</text></g>
<line x1="237" y1="426" x2="252" y2="426" class="arr" marker-end="url(#arrow)"/>
<line x1="427" y1="426" x2="442" y2="426" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="452" x2="340" y2="467" class="arr" marker-end="url(#arrow)"/>
<line x1="230" y1="596" x2="230" y2="626" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="626" x2="450" y2="596" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="140" y="630" width="180" height="52" rx="8" stroke-width="0.5"/><text class="th" x="230" y="647" text-anchor="middle" dominant-baseline="central">Telegram (+ WhatsApp)</text><text class="ts" x="230" y="666" text-anchor="middle" dominant-baseline="central">alertas al celular</text></g>
<g class="c-gray"><rect x="360" y="630" width="180" height="52" rx="8" stroke-width="0.5"/><text class="th" x="450" y="647" text-anchor="middle" dominant-baseline="central">Usuarios</text><text class="ts" x="450" y="666" text-anchor="middle" dominant-baseline="central">admin · técnico · caficultor</text></g>
</svg>

# A3 - NanoMQ del fog (Raspberry Pi 3 B+). Nodos -> TLS 8883; bridge TLS -> EMQX en la nube.
mqtt {
    max_packet_size = 64KB
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25
}

# Solo dentro de la red Docker (Node-RED del fog); este puerto NO se publica en el host.
listeners.tcp {
    bind = "0.0.0.0:1883"
}

# Nodos ESP32: TLS con el certificado de fog.finca firmado por la CA de la finca.
listeners.ssl {
    bind = "0.0.0.0:8883"
    keyfile = "/etc/certs/fog.key"
    certfile = "/etc/certs/fog.crt"
    cacertfile = "/etc/certs/ca_finca.crt"
    verify_peer = false
    fail_if_no_peer_cert = false
}

auth {
    allow_anonymous = false
    no_match = deny
    deny_action = disconnect
    password = {include "/etc/nanomq_pwd.conf"}
    acl = {include "/etc/nanomq_acl.conf"}
}

bridges.mqtt.nube {
    server = "tls+mqtt-tcp://mqtt.agrotecnet.cloud:8883"
    proto_ver = 4
    clientid = "gateway-rpi-finca"
    username = "gateway-rpi"
    password = "${GATEWAY_RPI_PASS}"
    clean_start = false
    keepalive = 20s   # detecta antes la caída de Internet (antes 60 s: se perdió 1 mensaje en la prueba)
    ssl {
        cacertfile = "/etc/certs/isrg_root_x1.pem"
        verify_peer = true
    }
    forwards = [
        { remote_topic = "", local_topic = "cafe/+/telemetria", qos = 1, retain = 2 }
        { remote_topic = "", local_topic = "cafe/+/estado",     qos = 1, retain = 2 }
        { remote_topic = "", local_topic = "cafe/+/agregado",   qos = 1, retain = 2 }
    ]
    subscription = [
        { remote_topic = "cafe/+/cmd", local_topic = "", qos = 1 }
    ]
    max_parallel_processes = 2
    max_send_queue_len = 512
    max_recv_queue_len = 128
}

# Store-and-forward: si se cae Internet, los mensajes QoS 1 del bridge se guardan en SQLite.
bridges.mqtt.cache {
    disk_cache_size = 102400
    mounted_file_path = "/var/lib/nanomq/"
    flush_mem_threshold = 100
    resend_interval = 5000
}

log {
    to = [console]
    level = warn
}
